# HoundDog.ai Self-Hosted.
#
# Quick start:
#   1. ./install.sh (generates the configuration and starts Docker Compose)
#   2. Open http://localhost:3300 and use HOUNDDOG_SETUP_KEY from .env to create your
#      organization and owner account.
#
# Scale the API and worker horizontally with:
#   docker compose up -d --scale api=3 --scale worker=2
#
# Point the CLI at the same public URL as the web app:
#   HOUNDDOG_ENV=self-hosted HOUNDDOG_URL=http://localhost:3300 HOUNDDOG_API_KEY=<api key> hounddog scan ...
#
# Set HOUNDDOG_PORT to change the published port. Set HOUNDDOG_URL to the public HTTPS origin when
# deploying behind a reverse proxy. All API requests use /api on that origin.
#
# Caddy limits sign-in, setup, and password attempts per client IP address. Behind a reverse proxy, set
# HOUNDDOG_TRUSTED_PROXIES so the limit applies to each client instead of the proxy (see .env.example).

# Keep the stack grouped under this parent project name in Docker Compose and Docker Desktop.
name: hounddog-self-hosted

# Shared definition for the containers running the hounddogai/hounddog-self-hosted image; the role is
# selected by `command`.
x-hounddog-self-hosted: &hounddog-self-hosted
  image: hounddogai/hounddog-self-hosted:${HOUNDDOG_IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: &hounddog-self-hosted-environment
    HOUNDDOG_SECRET_KEY: ${HOUNDDOG_SECRET_KEY:?is required. Run ./install.sh, or set a stable random string of 50+ characters. Encrypted data derives from it, so it must never change}
    # Required only until the first owner exists, and must start with hd_setup_ when set. Left optional here so
    # configured installations can remove it; first-run setup fails closed when it is empty.
    HOUNDDOG_SETUP_KEY: ${HOUNDDOG_SETUP_KEY:-}
    HOUNDDOG_POSTGRES_URL: ${HOUNDDOG_POSTGRES_URL:?is required. Run ./install.sh or provide a postgres:// or postgresql:// URL}
    HOUNDDOG_URL: ${HOUNDDOG_URL:-http://localhost:${HOUNDDOG_PORT:-3300}}
    # The CLI API key that the Trial installer generates; first-run setup stores it. Older installers wrote the
    # INITIAL_PERSONAL names instead.
    HOUNDDOG_INITIAL_API_KEY_ID: ${HOUNDDOG_INITIAL_API_KEY_ID:-}
    HOUNDDOG_INITIAL_API_KEY_HASH: ${HOUNDDOG_INITIAL_API_KEY_HASH:-}
    HOUNDDOG_INITIAL_API_KEY_PREFIX: ${HOUNDDOG_INITIAL_API_KEY_PREFIX:-}
    HOUNDDOG_INITIAL_PERSONAL_API_KEY_ID: ${HOUNDDOG_INITIAL_PERSONAL_API_KEY_ID:-}
    HOUNDDOG_INITIAL_PERSONAL_API_KEY_HASH: ${HOUNDDOG_INITIAL_PERSONAL_API_KEY_HASH:-}
    HOUNDDOG_INITIAL_PERSONAL_API_KEY_PREFIX: ${HOUNDDOG_INITIAL_PERSONAL_API_KEY_PREFIX:-}
    HOUNDDOG_API_DOCS: ${HOUNDDOG_API_DOCS:-0}
    # Where the API reads the AI models it offers; empty means https://hounddog.ai/model-catalog-v1.json.
    HOUNDDOG_MODEL_CATALOG_URL: ${HOUNDDOG_MODEL_CATALOG_URL:-}
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    container_name: hounddog-self-hosted-postgres
    image: postgres:18.6-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hounddog}
      POSTGRES_USER: ${POSTGRES_USER:-hounddog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hounddog}
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (data lives in a subdirectory).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    <<: *hounddog-self-hosted
    command: api
    volumes:
      - hounddog_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8800/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  worker:
    <<: *hounddog-self-hosted
    command: worker
    environment:
      <<: *hounddog-self-hosted-environment
      # The worker writes "ready" here while it can claim jobs, record their outcomes, and schedule its periodic jobs.
      HOUNDDOG_WORKER_HEALTH_FILE: /tmp/hounddog-worker-health
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - hounddog_data:/data
    healthcheck:
      test: ["CMD-SHELL", "grep -qx ready /tmp/hounddog-worker-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # The only service publishing a host port: serves the web UI and proxies /api across API replicas.
  caddy:
    <<: *hounddog-self-hosted
    container_name: hounddog-self-hosted-caddy
    command: caddy
    # Replaces the shared environment: Caddy needs none of the API's secrets.
    environment:
      HOUNDDOG_URL: ${HOUNDDOG_URL:-http://localhost:${HOUNDDOG_PORT:-3300}}
      HOUNDDOG_AUTH_RATE_LIMIT_EVENTS: ${HOUNDDOG_AUTH_RATE_LIMIT_EVENTS:-10}
      HOUNDDOG_AUTH_RATE_LIMIT_WINDOW: ${HOUNDDOG_AUTH_RATE_LIMIT_WINDOW:-1m}
      HOUNDDOG_TRUSTED_PROXIES: ${HOUNDDOG_TRUSTED_PROXIES:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HOUNDDOG_BIND_ADDRESS:+${HOUNDDOG_BIND_ADDRESS}:}${HOUNDDOG_PORT:-3300}:3300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3300/ && curl -fsS http://127.0.0.1:3300/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

volumes:
  postgres_data:
  hounddog_data:
